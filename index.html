        /* STILE DELLE RISPOSTE PRIMA DEL CLIC (MASSIMA LEGGIBILITÀ) */
        .option-btn {
            background-color: #f1f1f1 !important;

            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            opacity: 1 !important; /* Forza l'opacità massima su tutti i browser */
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #e5e5e5 !important;
        }
        
        /* STILE DELLE RISPOSTE DOPO IL CLIC (TESTO IN BIANCO PURO AD ALTO CONTRASTO) */
        .option-btn.correct:disabled { 
            background-color: var(--success) !important; 
            color: #FFFFFF !important; 
            border-color: var(--success) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #FFFFFF !important; /* Fix specifico per iOS Safari */

        .option-btn.wrong:disabled { 
            background-color: var(--error) !important; 
            color: #FFFFFF !important; 
            border-color: var(--error) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #FFFFFF !important; /* Fix specifico per iOS Safari */

        .option-btn:disabled:not(.correct):not(.wrong) {
            background-color: #e9e9e9 !important;
            color: #777777 !important;
            border-color: #ddd !important;
            opacity: 0.8 !important;
            -webkit-text-fill-color: #777777 !important;

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            line-height: 1.5;

            height: 8px;

function startQuiz() {
const nation = document.getElementById("nation-select").value;
const region = document.getElementById("region-select").value;
const type = document.getElementById("type-select").value;
const length = document.getElementById("length-select").value;
// Filtra il database
quizPool = database.filter(item => {

if (nation === "IT" && type !== "all" && item.type !== type) return false;

});
if (quizPool.length === 0) {
alert("Nessun vino trovato con questi filtri. Cambia i parametri!");

quizPool.sort(() => Math.random() - 0.5);

if (length === "max" || parseInt(length) > quizPool.length) {
selectedQuestionsCount = quizPool.length;

score = 0;

document.getElementById("quiz-screen").classList.remove("hidden");

function showQuestion() {

document.getElementById("score-display").innerText = Punti: ${score};
document.getElementById("progress").style.width = ${(currentQuestionIndex / selectedQuestionsCount) * 100}%;
currentQuestionObject = quizPool[currentQuestionIndex];
// Scegli a caso il tipo di domanda (0: Indovina il Vitigno, 1: Indovina la Regione)
const questionType = Math.floor(Math.random() * 2);
let questionText = "";
let correctAnswer = "";
let optionsPool = [];
if (questionType === 0) {
questionText = Qual è il vitigno principale del vino "${currentQuestionObject.name}" (${currentQuestionObject.region})?;
correctAnswer = currentQuestionObject.grape;
optionsPool = [...new Set(database.map(d => d.grape))];
} else {
questionText = In quale regione/zona viene prodotto il vino "${currentQuestionObject.name}" (${currentQuestionObject.type || 'AOC'})?;
correctAnswer = currentQuestionObject.region;
optionsPool = [...new Set(database.map(d => d.region))];
}
document.getElementById("question-text").innerText = questionText;
// Genera opzioni errate errate
optionsPool = optionsPool.filter(o => o !== correctAnswer).sort(() => Math.random() - 0.5);
let options = [correctAnswer, optionsPool[0], optionsPool[1], optionsPool[2]];
options.sort(() => Math.random() - 0.5); // Mescola le 4 opzioni finali
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
options.forEach(opt => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.innerText = opt;
btn.onclick = () => checkAnswer(btn, opt, correctAnswer);
optionsDiv.appendChild(btn);
});
}
function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
const buttons = document.querySelectorAll(".option-btn");
buttons.forEach(btn => {
btn.disabled = true; // Disabilita gli altri bottoni
if (btn.innerText === correctOpt) btn.classList.add("correct");
});
const feedbackDiv = document.getElementById("feedback");
feedbackDiv.classList.remove("hidden");
if (selectedOpt === correctOpt) {
score++;
selectedBtn.classList.add("correct");
feedbackDiv.style.backgroundColor = "#D4EFDF";
feedbackDiv.style.color = "#196F3D";
feedbackDiv.innerText = "Corretto! Ottimo lavoro.";
} else {
selectedBtn.classList.add("wrong");
feedbackDiv.style.backgroundColor = "#FADBD8";
feedbackDiv.style.color = "#78281F";
feedbackDiv.innerText = Sbagliato! La risposta corretta era: ${correctOpt}.;
}
// Mostra la scheda didattica completa
feedbackDiv.innerHTML += <br><span style="font-size:14px; font-weight:normal; color:#555;">Scheda tecnica: <strong>${currentQuestionObject.name}</strong> è un vino del territorio di/della <strong>${currentQuestionObject.region}</strong> a base di uva <strong>${currentQuestionObject.grape}</strong>.</span>;

document.getElementById("next-btn").classList.remove("hidden");
}

currentQuestionIndex++;

evaluationPara.innerText = "🍷 Ottimo livello! Hai un'ottima cultura enologica.";

evaluationPara.innerText = "🥂 Buona base, ma serve ancora un po' di degustazione e studio sui disciplinari.";
} else {
evaluationPara.innerText = "🍇 Livello Novizio. Ottima scusa per aprire qualche buona bottiglia e riprovare!";
}
}

const regionsIT = [...new Set(database.filter(d => d.nation === "IT").map(d => d.region))].sort();
const regionsFR = [...new Set(database.filter(d => d.nation === "FR").map(d => d.region))].sort();
let quizPool = [];
let currentQuestionIndex = 0;
let score = 0;
let selectedQuestionsCount = 0;
let currentQuestionObject = {};
function updateRegions() {
const nation = document.getElementById("nation-select").value;
const regionSelect = document.getElementById("region-select");
const typeSelect = document.getElementById("type-select");
regionSelect.innerHTML = 'Tutte le zone';
if(nation === "FR") {
typeSelect.disabled = true;
regionsFR.forEach(r => regionSelect.innerHTML += <option value="${r}">${r}</option>);
} else if(nation === "IT") {
typeSelect.disabled = false;
regionsIT.forEach(r => regionSelect.innerHTML += <option value="${r}">${r}</option>);
} else {
typeSelect.disabled = false;
const allRegions = [...regionsIT, ...regionsFR].sort();
allRegions.forEach(r => regionSelect.innerHTML += <option value="${r}">${r}</option>);
}
}
function startQuiz() {
const nation = document.getElementById("nation-select").value;
const region = document.getElementById("region-select").value;
const type = document.getElementById("type-select").value;
const length = document.getElementById("length-select").value;
quizPool = database.filter(item => {
if (nation !== "all" && item.nation !== nation) return false;
if (region !== "all" && item.region !== region) return false;
if (nation === "IT" && type !== "all" && item.type !== type) return false;
return true;
});
if (quizPool.length === 0) {
alert("Nessun vino trovato con questi filtri. Cambia i parametri!");
return;
}
quizPool.sort(() => Math.random() - 0.5);
if (length === "max" || parseInt(length) > quizPool.length) {
selectedQuestionsCount = quizPool.length;
} else {
selectedQuestionsCount = parseInt(length);
quizPool = quizPool.slice(0, selectedQuestionsCount);
}
currentQuestionIndex = 0;
score = 0;
document.getElementById("setup-screen").classList.add("hidden");
document.getElementById("quiz-screen").classList.remove("hidden");
showQuestion();
}
function showQuestion() {
document.getElementById("feedback").classList.add("hidden");
document.getElementById("next-btn").classList.add("hidden");
document.getElementById("question-number").innerText = Domanda ${currentQuestionIndex + 1}/${selectedQuestionsCount};
document.getElementById("score-display").innerText = Punti: ${score};
document.getElementById("progress").style.width = ${(currentQuestionIndex / selectedQuestionsCount) * 100}%;
currentQuestionObject = quizPool[currentQuestionIndex];
const questionType = Math.floor(Math.random() * 2);
let questionText = "";
let correctAnswer = "";
let optionsPool = [];
if (questionType === 0) {
questionText = Qual è il vitigno principale del vino "${currentQuestionObject.name}" (${currentQuestionObject.region})?;
correctAnswer = currentQuestionObject.grape;
optionsPool = [...new Set(database.map(d => d.grape))];
} else {
questionText = In quale regione/zona viene prodotto il vino "${currentQuestionObject.name}" (${currentQuestionObject.type || 'AOC'})?;
correctAnswer = currentQuestionObject.region;
optionsPool = [...new Set(database.map(d => d.region))];
}
document.getElementById("question-text").innerText = questionText;
optionsPool = optionsPool.filter(o => o !== correctAnswer).sort(() => Math.random() - 0.5);
let options = [correctAnswer, optionsPool[0], optionsPool[1], optionsPool[2]];
options.sort(() => Math.random() - 0.5);
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
options.forEach(opt => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.innerText = opt;
btn.onclick = () => checkAnswer(btn, opt, correctAnswer);
optionsDiv.appendChild(btn);
});
}
function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
const buttons = document.querySelectorAll(".option-btn");
buttons.forEach(btn => {
btn.disabled = true;
if (btn.innerText === correctOpt) btn.classList.add("correct");
});
const feedbackDiv = document.getElementById("feedback");
feedbackDiv.classList.remove("hidden");
if (selectedOpt === correctOpt) {
score++;
selectedBtn.classList.add("correct");
feedbackDiv.style.backgroundColor = "#D4EFDF";
feedbackDiv.style.color = "#196F3D";
feedbackDiv.innerText = "Corretto! Ottimo lavoro.";
} else {
selectedBtn.classList.add("wrong");
feedbackDiv.style.backgroundColor = "#FADBD8";
feedbackDiv.style.color = "#78281F";
feedbackDiv.innerText = Sbagliato! La risposta corretta era: ${correctOpt}.;
}
feedbackDiv.innerHTML += <br><span style="font-size:14px; font-weight:normal; color:#555;">Scheda tecnica: <strong>${currentQuestionObject.name}</strong> è un vino del territorio di/della <strong>${currentQuestionObject.region}</strong> a base di uva <strong>${currentQuestionObject.grape}</strong>.</span>;
document.getElementById("score-display").innerText = Punti: ${score};
document.getElementById("next-btn").classList.remove("hidden");
}
function nextQuestion() {
currentQuestionIndex++;
if (currentQuestionIndex < selectedQuestionsCount) {
showQuestion();
} else {
showEndScreen();
}
}
function showEndScreen() {
document.getElementById("quiz-screen").classList.add("hidden");
document.getElementById("end-screen").classList.remove("hidden");
const finalScorePara = document.getElementById("final-score");
const evaluationPara = document.getElementById("evaluation");
const percentage = (score / selectedQuestionsCount) * 100;
finalScorePara.innerText = Hai totalizzato ${score} risposte esatte su ${selectedQuestionsCount} (${percentage.toFixed(0)}%);
if (percentage === 100) {
evaluationPara.innerText = "🏆 Sommelier Eccellente! Conosci perfettamente i territori d'Italia e Francia.";
} else if (percentage >= 75) {
evaluationPara.innerText = "🍷 Ottimo livello! Hai un'ottima cultura enologica.";
} else if (percentage >= 50) {
evaluationPara.innerText = "🥂 Buona base, ma serve ancora un po' di degustazione e studio sui disciplinari.";
} else {
evaluationPara.innerText = "🍇 Livello Novizio. Ottima scusa per aprire qualche buona bottiglia e riprovare!";
}
}
function resetQuiz() {
document.getElementById("end-screen").classList.add("hidden");
document.getElementById("setup-screen").classList.remove("hidden");
}

Ecco il file definitivo pronto per essere scaricato e caricato sul tuo repository: index.html.

🛠️ Architettura dei Colori e Contrasto:
Stato Iniziale (Prima della risposta): I bottoni delle opzioni presentano uno sfondo grigio chiarissimo e il testo è forzato in un colore antracite scuro e nitido (#1A1A1A !important), garantendo una lettura immediata e confortevole.
Stato Attivo (Dopo la risposta): Quando viene fornita la risposta, il sistema applica le classi di feedback. Il bottone corretto si colora di verde brillante e quello errato di rosso acceso; in entrambi i casi, il testo passa istantaneamente a un bianco puro ad alta visibilità (#FFFFFF !important).

if (nation === "IT" && type !== "all" && item.type !== type) return false;
return true;
});
if (quizPool.length === 0) {
alert("Nessun vino trovato con questi filtri. Cambia i parametri!");

if (length === "max" || parseInt(length) > quizPool.length) {
selectedQuestionsCount = quizPool.length;

selectedQuestionsCount = parseInt(length);
quizPool = quizPool.slice(0, selectedQuestionsCount);

document.getElementById("question-number").innerText = Domanda ${currentQuestionIndex + 1}/${selectedQuestionsCount};
document.getElementById("score-display").innerText = Punti: ${score};
document.getElementById("progress").style.width = ${(currentQuestionIndex / selectedQuestionsCount) * 100}%;
currentQuestionObject = quizPool[currentQuestionIndex];
const questionType = Math.floor(Math.random() * 2);
let questionText = "";
let correctAnswer = "";
let optionsPool = [];
if (questionType === 0) {
questionText = Qual è il vitigno principale del vino "${currentQuestionObject.name}" (${currentQuestionObject.region})?;
correctAnswer = currentQuestionObject.grape;
optionsPool = [...new Set(database.map(d => d.grape))];
} else {
questionText = In quale regione/zona viene prodotto il vino "${currentQuestionObject.name}" (${currentQuestionObject.type || 'AOC'})?;
correctAnswer = currentQuestionObject.region;
optionsPool = [...new Set(database.map(d => d.region))];
}
document.getElementById("question-text").innerText = questionText;
optionsPool = optionsPool.filter(o => o !== correctAnswer).sort(() => Math.random() - 0.5);
let options = [correctAnswer, optionsPool[0], optionsPool[1], optionsPool[2]];
options.sort(() => Math.random() - 0.5);
const optionsDiv = document.getElementById("options");
optionsDiv.innerHTML = "";
options.forEach(opt => {
const btn = document.createElement("button");
btn.className = "option-btn";
btn.innerText = opt;
btn.onclick = () => checkAnswer(btn, opt, correctAnswer);
optionsDiv.appendChild(btn);
});
}
function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
const buttons = document.querySelectorAll(".option-btn");
buttons.forEach(btn => {
btn.disabled = true;
if (btn.innerText === correctOpt) btn.classList.add("correct");
});
const feedbackDiv = document.getElementById("feedback");
feedbackDiv.classList.remove("hidden");
if (selectedOpt === correctOpt) {
score++;
selectedBtn.classList.add("correct");
feedbackDiv.style.backgroundColor = "#D4EFDF";
feedbackDiv.style.color = "#196F3D";
feedbackDiv.innerText = "Corretto! Ottimo lavoro.";
} else {
selectedBtn.classList.add("wrong");
feedbackDiv.style.backgroundColor = "#FADBD8";
feedbackDiv.style.color = "#78281F";
feedbackDiv.innerText = Sbagliato! La risposta corretta era: ${correctOpt}.;
}
feedbackDiv.innerHTML += <br><span style="font-size:14px; font-weight:normal; color:#555;">Scheda tecnica: <strong>${currentQuestionObject.name}</strong> è un vino del territorio di/della <strong>${currentQuestionObject.region}</strong> a base di uva <strong>${currentQuestionObject.grape}</strong>.</span>;
document.getElementById("score-display").innerText = Punti: ${score};
document.getElementById("next-btn").classList.remove("hidden");
}
function nextQuestion() {
currentQuestionIndex++;
if (currentQuestionIndex < selectedQuestionsCount) {
showQuestion();
} else {
showEndScreen();
}
}
function showEndScreen() {
document.getElementById("quiz-screen").classList.add("hidden");
document.getElementById("end-screen").classList.remove("hidden");
const finalScorePara = document.getElementById("final-score");
const evaluationPara = document.getElementById("evaluation");
const percentage = (score / selectedQuestionsCount) * 100;
finalScorePara.innerText = Hai totalizzato ${score} risposte esatte su ${selectedQuestionsCount} (${percentage.toFixed(0)}%);
if (percentage === 100) {
evaluationPara.innerText = "🏆 Sommelier Eccellente! Conosci perfettamente i territori d'Italia e Francia.";
} else if (percentage >= 75) {
evaluationPara.innerText = "🍷 Ottimo livello! Hai un'ottima cultura enologica.";
} else if (percentage >= 50) {
evaluationPara.innerText = "🥂 Buona base, ma serve ancora un po' di degustazione e studio sui disciplinari.";
} else {
evaluationPara.innerText = "🍇 Livello Novizio. Ottima scusa per aprire qualche buona bottiglia e riprovare!";
}
}
function resetQuiz() {
document.getElementById("end-screen").classList.add("hidden");
document.getElementById("setup-screen").classList.remove("hidden");
}
updateRegions();
