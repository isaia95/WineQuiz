<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Enologico & Distillati dal Mondo</title>
    <style>
        :root {
            --primary: #581845;
            --secondary: #900C3F;
            --light: #F9F5F6;
            --dark: #1A1A1A;
            --success: #2ECC71;
            --error: #E74C3C;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--secondary); }
        .hidden { display: none; }
        .card {
            background: #fdfafb;
            border-left: 5px solid var(--primary);
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .option-btn {
            background-color: #f1f1f1 !important;
            color: #1A1A1A !important;
            text-align: left;
            border: 2px solid #ccc;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            opacity: 1 !important;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #e5e5e5 !important;
        }
        .option-btn.correct:disabled { 
            background-color: var(--success) !important; 
            color: #FFFFFF !important; 
            border-color: var(--success) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #FFFFFF !important;
        }
        .option-btn.wrong:disabled { 
            background-color: var(--error) !important; 
            color: #FFFFFF !important; 
            border-color: var(--error) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #FFFFFF !important;
        }
        .option-btn:disabled:not(.correct):not(.wrong) {
            background-color: #e9e9e9 !important;
            color: #777777 !important;
            border-color: #ddd !important;
            opacity: 0.8 !important;
            -webkit-text-fill-color: #777777 !important;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            line-height: 1.5;
        }
        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .score-board { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🍷 Quiz Vini & Distillati dal Mondo 🥃</h1>
    <div id="setup-screen">
        <div class="form-group">
            <label for="nation-select">Seleziona Nazione:</label>
            <select id="nation-select" onchange="updateRegions()">
                <option value="all">Tutto il Mondo</option>
            </select>
        </div>
        <div class="form-group">
            <label for="region-select">Zona / Regione:</label>
            <select id="region-select"><option value="all">Tutte le zone</option></select>
        </div>
        <div class="form-group">
            <label for="type-select">Classificazione / Tipologia:</label>
            <select id="type-select">
                <option value="all">Tutte (Vini & Distillati)</option>
                <option value="DOCG">Solo DOCG (Italia)</option>
                <option value="DOC">Solo DOC (Italia)</option>
                <option value="AOC">Solo AOC (Francia)</option>
                <option value="Distillato">Solo Distillati</option>
            </select>
        </div>
        <div class="form-group">
            <label for="length-select">Numero di domande:</label>
            <select id="length-select">
                <option value="10">10 Domande</option>
                <option value="20">20 Domande</option>
                <option value="30">30 Domande</option>
                <option value="max">Maratona (Tutte le disponibili)</option>
            </select>
        </div>
        <button onclick="startQuiz()">Inizia la Sfida</button>
    </div>
    <div id="quiz-screen" class="hidden">
        <div class="score-board">
            <div id="question-number">Domanda 1/10</div>
            <div id="score-display">Punti: 0</div>
        </div>
        <div class="progress-bar"><div id="progress" class="progress"></div></div>
        <div class="card"><h3 id="question-text">Caricamento domanda...</h3></div>
        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback hidden"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Prossima Domanda</button>
    </div>
    <div id="end-screen" class="hidden">
        <h2>Sfida Completata! 🍾</h2>
        <p id="final-score" style="font-size: 20px; font-weight: bold;"></p>
        <p id="evaluation"></p>
        <button onclick="resetQuiz()">Gioca Ancora</button>
    </div>
</div>
<script>
const countryNames = {
    "IT": "Italia",
    "FR": "Francia",
    "ES": "Spagna",
    "PT": "Portogallo",
    "US": "Stati Uniti",
    "UK": "Scozia / Regno Unito",
    "MX": "Messico",
    "AR": "Argentina",
    "CL": "Cile",
    "AU": "Australia",
    "NZ": "Nuova Zelanda",
    "ZA": "Sudafrica",
    "HU": "Ungheria",
    "JP": "Giappone",
    "MQ": "Martinica",
    "PE": "Perù"
};

const database = [
    // ITALIA - VINI
    { name: "Barolo", nation: "IT", region: "Piemonte", type: "DOCG", grape: "Nebbiolo" },
    { name: "Barbaresco", nation: "IT", region: "Piemonte", type: "DOCG", grape: "Nebbiolo" },
    { name: "Brunello di Montalcino", nation: "IT", region: "Toscana", type: "DOCG", grape: "Sangiovese" },
    { name: "Chianti Classico", nation: "IT", region: "Toscana", type: "DOCG", grape: "Sangiovese" },
    { name: "Bolgheri Sassicaia", nation: "IT", region: "Toscana", type: "DOC", grape: "Cabernet Sauvignon" },
    { name: "Amarone della Valpolicella", nation: "IT", region: "Veneto", type: "DOCG", grape: "Corvina" },
    { name: "Franciacorta", nation: "IT", region: "Lombardia", type: "DOCG", grape: "Chardonnay" },
    { name: "Oltrepò Pavese Metodo Classico", nation: "IT", region: "Lombardia", type: "DOCG", grape: "Pinot Nero" },
    { name: "Sforzato di Valtellina", nation: "IT", region: "Lombardia", type: "DOCG", grape: "Nebbiolo (Chiavennasca)" },
    { name: "Lugana", nation: "IT", region: "Lombardia/Veneto", type: "DOC", grape: "Trebbiano di Lugana" },
    { name: "Taurasi", nation: "IT", region: "Campania", type: "DOCG", grape: "Aglianico" },
    { name: "Etna Rosso", nation: "IT", region: "Sicilia", type: "DOC", grape: "Nerello Mascalese" },
    { name: "Passito di Pantelleria", nation: "IT", region: "Sicilia", type: "DOC", grape: "Zibibbo" },
    { name: "Vermentino di Gallura", nation: "IT", region: "Sardegna", type: "DOCG", grape: "Vermentino" },
    { name: "Trento DOC", nation: "IT", region: "Trentino-Alto Adige", type: "DOC", grape: "Chardonnay" },

    // ITALIA - DISTILLATI
    { name: "Grappa di Amarone", nation: "IT", region: "Veneto", type: "Distillato", grape: "Vinacce di Corvina" },
    { name: "Grappa di Moscato", nation: "IT", region: "Piemonte", type: "Distillato", grape: "Vinacce di Moscato" },

    // FRANCIA - VINI
    { name: "Margaux", nation: "FR", region: "Bordeaux", type: "AOC", grape: "Cabernet Sauvignon" },
    { name: "Pomerol", nation: "FR", region: "Bordeaux", type: "AOC", grape: "Merlot" },
    { name: "Sauternes", nation: "FR", region: "Bordeaux", type: "AOC", grape: "Sémillon" },
    { name: "Chablis", nation: "FR", region: "Borgogna", type: "AOC", grape: "Chardonnay" },
    { name: "Romanée-Conti", nation: "FR", region: "Borgogna", type: "AOC", grape: "Pinot Noir" },
    { name: "Champagne Blanc de Blancs", nation: "FR", region: "Champagne", type: "AOC", grape: "Chardonnay" },
    { name: "Châteauneuf-du-Pape", nation: "FR", region: "Valle del Rodano", type: "AOC", grape: "Grenache" },
    { name: "Sancerre", nation: "FR", region: "Valle della Loira", type: "AOC", grape: "Sauvignon Blanc" },

    // FRANCIA - DISTILLATI
    { name: "Cognac", nation: "FR", region: "Charente", type: "Distillato", grape: "Ugni Blanc (Trebbiano)" },
    { name: "Bas-Armagnac", nation: "FR", region: "Guascogna", type: "Distillato", grape: "Ugni Blanc / Baco" },
    { name: "Calvados", nation: "FR", region: "Normandia", type: "Distillato", grape: "Mele da sidro" },

    // SPAGNA
    { name: "Rioja Gran Reserva", nation: "ES", region: "La Rioja", type: "DOCa", grape: "Tempranillo" },
    { name: "Priorat", nation: "ES", region: "Catalogna", type: "DOQ", grape: "Garnacha" },
    { name: "Jerez / Sherry", nation: "ES", region: "Andalusia", type: "DO", grape: "Palomino" },
    { name: "Cava", nation: "ES", region: "Penedès", type: "DO", grape: "Macabeo / Xarel-lo" },

    // PORTOGALLO
    { name: "Porto Vintage", nation: "PT", region: "Valle del Douro", type: "DOC", grape: "Touriga Nacional" },
    { name: "Madeira", nation: "PT", region: "Isola di Madeira", type: "DOP", grape: "Tinta Negra / Sercial" },

    // STATI UNITI
    { name: "Napa Valley Cabernet", nation: "US", region: "California", type: "AVA", grape: "Cabernet Sauvignon" },
    { name: "Bourbon Whiskey", nation: "US", region: "Kentucky", type: "Distillato", grape: "Mais (minimo 51%)" },
    { name: "Tennessee Whiskey", nation: "US", region: "Tennessee", type: "Distillato", grape: "Mais / Filtrato su carboni d'acero" },

    // SCOZIA / REGNO UNITO
    { name: "Scotch Whisky (Islay Single Malt)", nation: "UK", region: "Islay (Scozia)", type: "Distillato", grape: "Orzo maltato torbato" },
    { name: "Scotch Whisky (Speyside Single Malt)", nation: "UK", region: "Speyside (Scozia)", type: "Distillato", grape: "Orzo maltato" },

    // MESSICO
    { name: "Tequila 100% Agave", nation: "MX", region: "Jalisco", type: "Distillato", grape: "Agave Blu (Tequilana Weber)" },
    { name: "Mezcal Artesanal", nation: "MX", region: "Oaxaca", type: "Distillato", grape: "Agave Espadín / Agavi selvatiche" },

    // SUD AMERICA
    { name: "Mendoza Malbec", nation: "AR", region: "Mendoza", type: "GI", grape: "Malbec" },
    { name: "Casablanca Carmenère", nation: "CL", region: "Valle de Colchagua", type: "DO", grape: "Carmenère" },
    { name: "Pisco", nation: "PE", region: "Ica", type: "DOC", grape: "Uva Quebranta" },

    // OCEANIA & SUDAFRICA
    { name: "Barossa Valley Shiraz", nation: "AU", region: "South Australia", type: "GI", grape: "Shiraz" },
    { name: "Marlborough Sauvignon Blanc", nation: "NZ", region: "Marlborough", type: "GI", grape: "Sauvignon Blanc" },
    { name: "Stellenbosch Pinotage", nation: "ZA", region: "Stellenbosch", type: "WO", grape: "Pinotage" },

    // UNGHERIA, GIAPPONE & CARAIBI
    { name: "Tokaji Aszú", nation: "HU", region: "Tokaj", type: "PDO", grape: "Furmint" },
    { name: "Sake Junmai Daiginjo", nation: "JP", region: "Giappone", type: "Fermentato", grape: "Riso Sakamai" },
    { name: "Japanese Whisky", nation: "JP", region: "Yamazaki / Yoichi", type: "Distillato", grape: "Orzo maltato" },
    { name: "Rhum Agricole", nation: "MQ", region: "Martinica", type: "AOC", grape: "Succo fresco di Canna da Zucchero" }
];

let quizPool = [];
let currentQuestionIndex = 0;
let score = 0;
let selectedQuestionsCount = 0;
let currentQuestionObject = {};

function initNations() {
    const nationSelect = document.getElementById("nation-select");
    const nationsInDb = [...new Set(database.map(d => d.nation))].sort();
    
    nationsInDb.forEach(code => {
        const name = countryNames[code] || code;
        const option = document.createElement("option");
        option.value = code;
        option.textContent = name;
        nationSelect.appendChild(option);
    });
}

function updateRegions() {
    const nation = document.getElementById("nation-select").value;
    const regionSelect = document.getElementById("region-select");
    const typeSelect = document.getElementById("type-select");
    
    regionSelect.innerHTML = '<option value="all">Tutte le zone</option>';
    
    let filteredDb = database;
    if (nation !== "all") {
        filteredDb = database.filter(d => d.nation === nation);
    }
    
    const availableRegions = [...new Set(filteredDb.map(d => d.region))].sort();
    availableRegions.forEach(r => {
        regionSelect.innerHTML += `<option value="${r}">${r}</option>`;
    });

    if (nation !== "IT" && nation !== "all") {
        typeSelect.value = "all";
    }
}

function startQuiz() {
    const nation = document.getElementById("nation-select").value;
    const region = document.getElementById("region-select").value;
    const type = document.getElementById("type-select").value;
    const length = document.getElementById("length-select").value;
    
    quizPool = database.filter(item => {
        if (nation !== "all" && item.nation !== nation) return false;
        if (region !== "all" && item.region !== region) return false;
        if (type !== "all" && item.type !== type) return false;
        return true;
    });

    if (quizPool.length === 0) {
        alert("Nessun prodotto trovato con questi filtri. Cambia i parametri!");
        return;
    }

    quizPool.sort(() => Math.random() - 0.5);
    
    if (length === "max" || parseInt(length) > quizPool.length) {
        selectedQuestionsCount = quizPool.length;
    } else {
        selectedQuestionsCount = parseInt(length);
        quizPool = quizPool.slice(0, selectedQuestionsCount);
    }

    currentQuestionIndex = 0;
    score = 0;
    document.getElementById("setup-screen").classList.add("hidden");
    document.getElementById("quiz-screen").classList.remove("hidden");
    showQuestion();
}

function showQuestion() {
    document.getElementById("feedback").classList.add("hidden");
    document.getElementById("next-btn").classList.add("hidden");
    document.getElementById("question-number").innerText = `Domanda ${currentQuestionIndex + 1}/${selectedQuestionsCount}`;
    document.getElementById("score-display").innerText = `Punti: ${score}`;
    document.getElementById("progress").style.width = `${(currentQuestionIndex / selectedQuestionsCount) * 100}%`;
    
    currentQuestionObject = quizPool[currentQuestionIndex];
    const questionType = Math.floor(Math.random() * 2);
    let questionText = "";
    let correctAnswer = "";
    let optionsPool = [];

    const isDistillate = currentQuestionObject.type === "Distillato" || currentQuestionObject.type === "Fermentato";
    const rawMaterialLabel = isDistillate ? "materia prima / ingrediente base" : "vitigno principale";

    if (questionType === 0) {
        questionText = `Qual è il ${rawMaterialLabel} del prodotto "${currentQuestionObject.name}" (${currentQuestionObject.region})?`;
        correctAnswer = currentQuestionObject.grape;
        
        // Cerca distrattori della stessa nazione
        optionsPool = [...new Set(database.filter(d => d.nation === currentQuestionObject.nation).map(d => d.grape))];
        
        // Fallback: se la nazione ha meno di 4 opzioni, attinge dall'intero database
        if (optionsPool.length < 4) {
            optionsPool = [...new Set(database.map(d => d.grape))];
        }
    } else {
        questionText = `In quale regione/zona si produce "${currentQuestionObject.name}" (${currentQuestionObject.type})?`;
        correctAnswer = currentQuestionObject.region;
        
        optionsPool = [...new Set(database.filter(d => d.nation === currentQuestionObject.nation).map(d => d.region))];
        
        if (optionsPool.length < 4) {
            optionsPool = [...new Set(database.map(d => d.region))];
        }
    }
    
    document.getElementById("question-text").innerText = questionText;
    
    optionsPool = optionsPool.filter(o => o !== correctAnswer).sort(() => Math.random() - 0.5);
    
    let options = [correctAnswer, optionsPool[0], optionsPool[1], optionsPool[2]];
    options.sort(() => Math.random() - 0.5);
    
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";
    options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(btn, opt, correctAnswer);
        optionsDiv.appendChild(btn);
    });
}

function checkAnswer(selectedBtn, selectedOpt, correctOpt) {
    const buttons = document.querySelectorAll(".option-btn");
    buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.innerText === correctOpt) btn.classList.add("correct");
    });

    const feedbackDiv = document.getElementById("feedback");
    feedbackDiv.classList.remove("hidden");
    
    if (selectedOpt === correctOpt) {
        score++;
        selectedBtn.classList.add("correct");
        feedbackDiv.style.backgroundColor = "#D4EFDF";
        feedbackDiv.style.color = "#196F3D";
        feedbackDiv.innerText = "Corretto! Ottimo lavoro.";
    } else {
        selectedBtn.classList.add("wrong");
        feedbackDiv.style.backgroundColor = "#FADBD8";
        feedbackDiv.style.color = "#78281F";
        feedbackDiv.innerText = `Sbagliato! La risposta corretta era: ${correctOpt}.`;
    }
    
    feedbackDiv.innerHTML += `<br><span style="font-size:14px; font-weight:normal; color:#555;">Scheda: <strong>${currentQuestionObject.name}</strong> (${countryNames[currentQuestionObject.nation] || currentQuestionObject.nation}) - Zona: <strong>${currentQuestionObject.region}</strong> - Base: <strong>${currentQuestionObject.grape}</strong>.</span>`;
    
    document.getElementById("score-display").innerText = `Punti: ${score}`;
    document.getElementById("next-btn").classList.remove("hidden");
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < selectedQuestionsCount) {
        showQuestion();
    } else {
        showEndScreen();
    }
}

function showEndScreen() {
    document.getElementById("quiz-screen").classList.add("hidden");
    document.getElementById("end-screen").classList.remove("hidden");
    
    const finalScorePara = document.getElementById("final-score");
    const evaluationPara = document.getElementById("evaluation");
    const percentage = (score / selectedQuestionsCount) * 100;
    
    finalScorePara.innerText = `Hai totalizzato ${score} risposte esatte su ${selectedQuestionsCount} (${percentage.toFixed(0)}%)`;
    
    if (percentage === 100) {
        evaluationPara.innerText = "🏆 Esperto Globale! Conosci perfettamente vini e distillati di tutto il mondo.";
    } else if (percentage >= 75) {
        evaluationPara.innerText = "🍷 Conoscitore Internazionale! Ottima cultura enologica e di distillazione.";
    } else if (percentage >= 50) {
        evaluationPara.innerText = "🥂 Buona base! Qualche ripasso sulle zone geografiche ti renderà imbattibile.";
    } else {
        evaluationPara.innerText = "🍇 Livello Apprendista. Una fantastica scusa per viaggiare e degustare di più!";
    }
}

function resetQuiz() {
    document.getElementById("end-screen").classList.add("hidden");
    document.getElementById("setup-screen").classList.remove("hidden");
}

// Inizializzazione
initNations();
updateRegions();
</script>
</body>
</html>
