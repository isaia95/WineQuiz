<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Enologico Internazionale: Italia & Francia</title>
    <style>
        :root {
            --primary: #581845;
            --secondary: #900C3F;
            --light: #F9F5F6;
            --dark: #1A1A1A;
            --success: #2ECC71;
            --error: #E74C3C;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 { color: var(--primary); text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover { background-color: var(--secondary); }
        .hidden { display: none; }
        .card {
            background: #fdfafb;
            border-left: 5px solid var(--primary);
            padding: 20px;
            margin: 20px 0;
            border-radius: 4px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        
        .option-btn {
            background-color: #f1f1f1 !important;
            color: #1A1A1A !important;
            text-align: left;
            border: 2px solid #ccc;
            border-radius: 6px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            box-sizing: border-box;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            opacity: 1 !important;
        }
        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background-color: #e5e5e5 !important;
        }
        
        .option-btn.correct:disabled { 
            background-color: var(--success) !important; 
            color: #FFFFFF !important; 
            border-color: var(--success) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #FFFFFF !important;
        }
        .option-btn.wrong:disabled { 
            background-color: var(--error) !important; 
            color: #FFFFFF !important; 
            border-color: var(--error) !important;
            opacity: 1 !important;
            -webkit-text-fill-color: #FFFFFF !important;
        }
        .option-btn:disabled:not(.correct):not(.wrong) {
            background-color: #e9e9e9 !important;
            color: #777777 !important;
            border-color: #ddd !important;
            opacity: 0.8 !important;
            -webkit-text-fill-color: #777777 !important;
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            line-height: 1.5;
        }
        .progress-bar {
            height: 8px;
            background: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .progress { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s; }
        .score-board { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🍷 Quiz Enologico Internazionale</h1>

    <!-- SCHERMATA CONFIGURAZIONE -->
    <div id="setup-screen">
        <div class="form-group">
            <label for="nation-select">Seleziona Nazione:</label>
            <select id="nation-select" onchange="updateRegions()">
                <option value="all">Tutte (Italia & Francia)</option>
                <option value="IT">Italia</option>
                <option value="FR">Francia</option>
            </select>
        </div>

        <div class="form-group">
            <label for="region-select">Zona / Regione:</label>
            <select id="region-select">
                <option value="all">Tutte le zone</option>
            </select>
        </div>

        <div class="form-group">
            <label for="type-select">Classificazione (Solo Italia):</label>
            <select id="type-select">
                <option value="all">Tutte (DOC & DOCG)</option>
                <option value="DOCG">Solo DOCG</option>
                <option value="DOC">Solo DOC</option>
            </select>
        </div>

        <div class="form-group">
            <label for="length-select">Numero di domande:</label>
            <select id="length-select">
                <option value="10">10 Domande</option>
                <option value="20">20 Domande</option>
                <option value="30">30 Domande</option>
                <option value="max">Maratona (Tutte le disponibili)</option>
            </select>
        </div>

        <button onclick="startQuiz()">Inizia la Sfida</button>
    </div>

    <!-- SCHERMATA GIOCO -->
    <div id="quiz-screen" class="hidden">
        <div class="score-board">
            <div id="question-number">Domanda 1/10</div>
            <div id="score-display">Punti: 0</div>
        </div>
        <div class="progress-bar"><div id="progress" class="progress"></div></div>

        <div class="card">
            <h3 id="question-text">Caricamento domanda...</h3>
        </div>

        <div id="options" class="options-grid"></div>
        <div id="feedback" class="feedback hidden"></div>
        <button id="next-btn" class="hidden" onclick="nextQuestion()">Prossima Domanda</button>
    </div>

    <!-- SCHERMATA FINALE -->
    <div id="end-screen" class="hidden">
        <h2>Sfida Completata! 🍾</h2>
        <p id="final-score" style="font-size: 20px; font-weight: bold;"></p>
        <p id="evaluation"></p>
        <button onclick="resetQuiz()">Gioca Ancora</button>
    </div>
</div>

function nextQuestion() {
currentQuestionIndex++;
if (currentQuestionIndex < selectedQuestionsCount) {
showQuestion();
} else {

}
}
function showEndScreen() {
document.getElementById("quiz-screen").classList.add("hidden");
document.getElementById("end-screen").classList.remove("hidden");
const finalScorePara = document.getElementById("final-score");
const evaluationPara = document.getElementById("evaluation");
const percentage = (score / selectedQuestionsCount) * 100;
finalScorePara.innerText = Hai totalizzato ${score} risposte esatte su ${selectedQuestionsCount} (${percentage.toFixed(0)}%);
if (percentage === 100) {
evaluationPara.innerText = "🏆 Sommelier Eccellente! Conosci perfettamente i territori d'Italia e Francia.";
} else if (percentage >= 75) {
evaluationPara.innerText = "🍷 Ottimo livello! Hai un'ottima cultura enologica.";
} else if (percentage >= 50) {
evaluationPara.innerText = "🥂 Buona base, ma serve ancora un po' di degustazione e studio sui disciplinari.";
} else {
evaluationPara.innerText = "🍇 Livello Novizio. Ottima scusa per aprire qualche buona bottiglia e riprovare!";
}
}
function resetQuiz() {
document.getElementById("end-screen").classList.add("hidden");
document.getElementById("setup-screen").classList.remove("hidden");
}
updateRegions();
